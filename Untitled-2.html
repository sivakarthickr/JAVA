<!DOCTYPE html>
<html>
<head>
    <title>Countries Table</title>
    <style>
        table {
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }

        /* Column colors */
        th:nth-child(1), td:nth-child(1) {
            background-color: lightcoral;
        }

        th:nth-child(2), td:nth-child(2) {
            background-color: lightblue;
        }

        th:nth-child(3), td:nth-child(3) {
            background-color: lightgreen;
        }

        th:nth-child(4), td:nth-child(4) {
            background-color: khaki;
        }
    </style>
</head>
<body>

<h2>Countries</h2>

<table>
    <tr>
        <th>S.No</th>
        <th>Country</th>
        <th>Capital</th>
        <th>Continent</th>
    </tr>
    <tr>
        <td>1</td>
        <td>India</td>
        <td>New Delhi</td>
        <td>Asia</td>
    </tr>
    <tr>
        <td>2</td>
        <td>China</td>
        <td>Beijing</td>
        <td>Asia</td>
    </tr>
    <tr>
        <td>3</td>
        <td>Japan</td>
        <td>Tokyo</td>
        <td>Asia</td>
    </tr>
</table>
</body>
</html>
